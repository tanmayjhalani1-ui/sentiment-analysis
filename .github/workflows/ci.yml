name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q src api app.py
      - name: Validate pipelines
        run: |
          python - <<'PY'
          from src.train import make_pipeline, load_data
          data = load_data()
          for name in ("naive_bayes", "logistic_regression"):
              model = make_pipeline(name).fit(data["text"], data["label"])
              assert set(model.classes_) == {"negative", "neutral", "positive"}
              print(name, model.predict(["This is excellent!"])[0])
          PY
